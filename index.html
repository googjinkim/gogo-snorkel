<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'self'; script-src 'self' https://dapi.kakao.com https://*.daumcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://*.daumcdn.net https://dapi.kakao.com; connect-src 'self' https://dapi.kakao.com https://*.daumcdn.net;">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A4%BF</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" integrity="sha384-ND+q1IVc0KDElX60dZaqKc7Xl9cdxd2PpU2JfVUHcurCkFVtVLFdt9vJfxtHSL3p" crossorigin="anonymous">
<style>
  :root{
    --bg:#F3F7F6;
    --panel:#D7E9F7;
    --panel-line:#B9D3EA;
    --panel-text:#14405E;
    --panel-text-dim:#4C7597;
    --accent:#137D8C;
    --accent-strong:#0B5661;
    --text:#152229;
    --text-mute:#5C6E74;
    --text-secondary:#5C6E74;
    --line:#DCE6E4;
    --card:#FFFFFF;
    --good:#1E8E5A;
    --mid:#C98A12;
    --warn:#D65C43;
    --tier-blue:#1C6FAE;
    --tier-orange:#C8631A;
    --fill-warning:#E8A317;
    --radius:10px;
    --header-height:71px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans KR",-apple-system,sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .mono{font-family:"IBM Plex Mono",monospace;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--panel);
    border-bottom:1px solid var(--panel-line);
    display:flex;align-items:center;gap:18px;
    padding:14px 20px;
  }
  .brand{
    display:flex;align-items:baseline;gap:8px;
    font-family:"Space Grotesk",sans-serif;
    color:var(--panel-text);font-weight:700;font-size:19px;
    white-space:nowrap;cursor:pointer;
    background:none;border:none;padding:0;
  }
  .brand .brand-sub{
    font-family:"Noto Sans KR",sans-serif;
    font-weight:400;font-size:12px;color:var(--panel-text-dim);
  }
  .search-form{
    flex:1;display:flex;max-width:560px;
    background:#FFFFFF;border:1px solid var(--panel-line);
    border-radius:999px;overflow:hidden;
  }
  .search-form input{
    flex:1;border:none;background:transparent;color:var(--panel-text);
    padding:10px 16px;font-size:14px;font-family:inherit;
  }
  .search-form input::placeholder{color:var(--panel-text-dim);}
  .search-form input:focus{outline:none;}
  .search-form button{
    border:none;background:var(--accent);color:#fff;
    padding:0 20px;font-size:13px;font-weight:500;cursor:pointer;
  }
  .search-form button:hover{background:var(--accent-strong);}

  /* ---------- layout ---------- */
  .layout{display:flex;align-items:flex-start;}

  aside{
    width:172px;flex:none;
    background:var(--panel);color:var(--panel-text);
    min-height:calc(100vh - var(--header-height));
    padding:18px 0;
    position:sticky;top:var(--header-height);
    display:flex;flex-direction:column;
  }

  @media (min-width:721px){
    aside{
      max-height:calc(100vh - var(--header-height));
      overflow-y:auto;
      z-index:10;
    }
  }
  .side-group-header{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px 9px 20px;font-size:13px;font-weight:500;
    color:var(--panel-text);letter-spacing:.02em;
    background:none;border:none;cursor:pointer;font-family:inherit;
    flex-shrink:0;
  }
  .region-count-chip{
    background:var(--panel-text);color:var(--panel);
    font-size:11px;padding:4px 10px;border-radius:999px;
    flex:none;transition:opacity .2s ease;
  }
  .side-group-header.collapsed .region-count-chip{opacity:.6;}
  .region-group{
    overflow:hidden;max-height:400px;transition:max-height .25s ease;
    flex-shrink:0;
  }
  .region-group.collapsed{max-height:0;}
  .side-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 20px;font-size:14px;cursor:pointer;
    border-left:3px solid transparent;
    color:var(--panel-text);
    flex-shrink:0;
  }
  .side-item:hover{background:#C3DEF1;}
  .side-item.active{
    border-left-color:var(--accent);
    background:#C3DEF1;
    font-weight:500;color:var(--panel-text);
  }
  .side-item small{color:var(--panel-text-dim);font-size:11px;}

  .side-photo{
    flex:1;min-height:140px;position:relative;overflow:hidden;
    background:var(--panel);
  }
  .side-photo img{
    width:100%;height:100%;object-fit:cover;display:block;
    position:absolute;inset:0;
    opacity:0;transition:opacity .5s ease;
  }
  .side-photo img.loaded{opacity:1;}
  .side-photo::before{
    content:"";position:absolute;top:0;left:0;right:0;height:72px;z-index:1;
    background:linear-gradient(to bottom,
      var(--panel) 0%, var(--panel) 15%, transparent 100%);
  }

  main{flex:1;min-width:0;padding:22px 26px 60px;}

  .page-title{
    display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap;
  }
  .page-title h1{
    font-size:20px;margin:0;font-weight:700;
  }
  .page-title .count{color:var(--text-mute);font-size:13px;}
  .page-sub{color:var(--text-mute);font-size:13px;margin:0 0 18px;}

  .legend{
    display:flex;gap:14px;flex-wrap:wrap;color:var(--text-mute);
    font-size:12px;margin-bottom:18px;
  }

  .legend-restroom-badge{
    background:#E6F3F2;color:var(--accent-strong);
    border-radius:999px;padding:3px 10px;font-weight:700;
  }

  .list-sticky{
    position:sticky;top:var(--header-height);z-index:15;
    background:var(--bg);
    padding:12px 0 14px;
    box-shadow:0 6px 10px -8px rgba(20,64,94,.25);
  }
  .list-sticky > *:last-child{margin-bottom:0;}

  /* ---------- location row ---------- */
  .location{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:14px;
    overflow:hidden;
  }
  .location-head{
    display:flex;align-items:center;justify-content:flex-start;
    padding:13px 18px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .location-name{font-size:15px;font-weight:700;}
  .location-area{
    font-size:11px;color:var(--accent-strong);
    background:#E6F3F2;padding:2px 9px;border-radius:999px;margin-left:8px;
  }
  .no-khoa-tag{
    font-size:11px;color:var(--text-mute);
  }
  .detail-btn{
    border:1px solid var(--accent);color:var(--accent-strong);
    background:#fff;border-radius:7px;padding:6px 14px;
    font-size:12.5px;cursor:pointer;font-weight:500;white-space:nowrap;
    margin-left:16px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .detail-btn i{font-size:14px;}
  .detail-btn:hover{background:var(--accent);color:#fff;}

  .day-block{padding:12px 18px;border-bottom:1px solid var(--line);}
  .day-block:last-child{border-bottom:none;}
  .day-label{font-size:12px;color:var(--text-mute);margin-bottom:8px;font-weight:500;}

  .slots{display:flex;gap:8px;flex-wrap:wrap;}
  .slot{
    flex:1 1 108px;min-width:104px;
    border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;
  }
  .slot .t{font-size:12px;color:var(--text-mute);margin-bottom:4px;}
  .slot .row1{display:flex;align-items:center;justify-content:space-between;}
  .slot .score{font-size:16px;font-weight:600;}
  .score.good, td .score.good{color:var(--good);}
  .score.mid, td .score.mid{color:var(--mid);}
  .score.warn, td .score.warn{color:var(--warn);}
  .slot .metrics{
    margin-top:4px;font-size:11.5px;color:var(--text-mute);
    display:flex;gap:8px;
  }
  .slot.empty{color:var(--text-mute);font-size:12px;display:flex;align-items:center;justify-content:center;}

  /* ---------- detail view ---------- */
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--accent-strong);font-size:13px;cursor:pointer;
    margin-bottom:14px;background:none;border:none;padding:0;font-weight:500;
  }
  .back-link:hover{text-decoration:underline;}

  .detail-sticky{
    position:sticky;top:var(--header-height);z-index:15;
    background:var(--bg);
    padding:12px 0 14px;
    box-shadow:0 6px 10px -8px rgba(20,64,94,.25);
  }
  .detail-sticky > *:last-child{margin-bottom:0;}

  .restroom-card{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;margin-bottom:16px;
  }
  .restroom-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .restroom-icon{font-size:20px;flex:none;line-height:1;}
  .restroom-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .restroom-name{font-size:13.5px;font-weight:600;}
  .restroom-addr{
    font-size:12px;color:var(--text-mute);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .restroom-map-btn{
    border:1px solid var(--accent);color:var(--accent-strong);
    background:#fff;border-radius:7px;padding:6px 14px;
    font-size:12.5px;cursor:pointer;font-weight:500;white-space:nowrap;flex:none;
  }
  .restroom-map-btn:hover{background:var(--accent);color:#fff;}
  .restroom-map{
    flex-basis:100%;width:100%;height:200px;border-radius:8px;
    margin-top:4px;border:1px solid var(--line);
  }

  .week-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .week-tab{
    border:1px solid var(--panel-line);background:var(--card);color:var(--text-mute);
    border-radius:999px;padding:6px 16px;font-size:12.5px;font-weight:500;cursor:pointer;
  }
  .week-tab:hover{background:#EEF4F3;}
  .week-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .hour-day{margin-bottom:20px;}
  .hour-day h2{
    display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px;
    min-height:36px;
    font-size:14px;margin:0 0 8px;color:var(--text-mute);font-weight:500;
  }
  .day-best-label{font-size:13px;font-weight:400;color:var(--text-secondary);}
  .day-best{display:flex;align-items:flex-end;gap:6px;}
  .time-badge-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .crown-icon{font-size:13px;color:var(--fill-warning);line-height:1;}
  .crown-icon.hidden{visibility:hidden;}
  .time-badge{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;font-weight:600;line-height:1.4;
    padding:2px 8px;border-radius:999px;
  }
  .time-badge.tier-90{background:#E3F3EA;color:var(--good);}
  .time-badge.tier-80{background:#E3EEF7;color:var(--tier-blue);}
  .time-badge.tier-65{background:#FBF0DC;color:var(--mid);}
  .time-badge.tier-50{background:#FBE9DC;color:var(--tier-orange);}
  .time-badge.tier-low{background:#FBE3DE;color:var(--warn);}
  table.hours{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table.hours th{
    text-align:left;font-size:11px;color:var(--text-mute);font-weight:500;
    padding:8px 10px;border-bottom:1px solid var(--line);background:#FAFCFB;
  }
  table.hours td{
    padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;
  }
  table.hours tr:last-child td{border-bottom:none;}
  .reason-cell{color:var(--text-mute);font-size:12px;}

  /* ---------- states ---------- */
  .empty-state{
    padding:50px 20px;text-align:center;color:var(--text-mute);
    border:1px dashed var(--line);border-radius:var(--radius);
  }
  .loading{padding:40px 20px;color:var(--text-mute);font-size:13px;}

  /* ---------- mobile: hamburger + off-canvas sidebar ---------- */
  .menu-toggle{
    display:none;background:none;border:none;color:var(--panel-text);
    font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;
  }
  .side-panel-head{
    display:none;align-items:center;justify-content:space-between;
    padding:0 20px 14px;color:var(--panel-text);font-weight:700;font-size:15px;
  }
  .side-panel-head button{
    background:none;border:none;color:var(--panel-text-dim);
    font-size:18px;cursor:pointer;padding:4px;
  }
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(6,20,28,.55);z-index:55;
  }
  .sidebar-overlay.show{display:block;}

  /* ---------- mobile: summary list ---------- */
  .summary-row{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 16px;margin-bottom:8px;cursor:pointer;
  }
  .summary-row:active{background:#F3FAF9;}
  .summary-info{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;}
  .summary-info .location-area{align-self:flex-start;margin-left:0;}
  .summary-slot{
    display:flex;flex-direction:column;align-items:center;flex:none;padding:0 4px;
  }
  .summary-slot .label{font-size:10px;color:var(--text-mute);}
  .summary-slot .time{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--text-mute);}
  .summary-score{display:flex;align-items:center;gap:8px;flex:none;}
  .summary-score .score{font-size:16px;font-weight:600;}
  .summary-score .chev{color:var(--text-mute);font-size:18px;}
  .summary-wave{
    font-size:12px;color:var(--text-mute);background:#EEF4F3;
    padding:3px 7px;border-radius:6px;
  }

  @media (max-width:720px){
    .menu-toggle{display:inline-flex;align-items:center;}
    .side-panel-head{display:flex;}

    aside{
      position:fixed;top:0;left:0;bottom:0;
      width:230px;min-height:100vh;
      padding:20px 0;
      transform:translateX(-100%);
      transition:transform .22s ease;
      z-index:60;overflow-y:auto;
      pointer-events:none;
    }
    aside.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.35);pointer-events:auto;}

    .layout{flex-direction:column;align-items:stretch;}
    main{padding:16px 8px;}
    .brand-sub{display:none;}
    .brand-text{display:none;}

    .location-head{justify-content:space-between;}
    .detail-btn{margin-left:0;}
    .detail-btn i{display:none;}

    .search-form input{text-align:center;min-width:0;}
    .search-form button{min-width:0;}

    table.hours{table-layout:fixed;}
    table.hours th{white-space:nowrap;padding:6px 4px;font-size:10px;}
    table.hours td{padding:6px 4px;font-size:12px;}
    table.hours th:nth-child(1),table.hours td:nth-child(1){width:15%;}
    table.hours th:nth-child(2),table.hours td:nth-child(2){width:17%;}
    table.hours th:nth-child(3),table.hours td:nth-child(3){width:18%;}
    table.hours th:nth-child(4),table.hours td:nth-child(4){width:18%;}
    table.hours th:nth-child(5),table.hours td:nth-child(5){width:18%;}
    table.hours th:nth-child(6),table.hours td:nth-child(6){width:14%;}
  }
</style>
</head>
<body>

<header>
  <button class="menu-toggle" id="menuToggle" aria-label="지역 메뉴 열기">☰</button>
  <button class="brand" id="brandBtn" title="홈으로">🤿 <span class="brand-text">Let's Snorkel</span><span class="brand-sub">동해안 스노클 컨디션</span></button>
  <form class="search-form" id="searchForm">
    <input type="text" id="searchInput" placeholder="포인트/지역 이름으로 검색 (예: 남애, 속초, 울진)" autocomplete="off">
    <button type="submit">검색</button>
  </form>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
  <aside>
    <div class="side-panel-head"><span>메뉴</span><button id="sidebarClose" aria-label="닫기">✕</button></div>
    <div class="side-item active" data-region="__ALL__">전체 <small id="allCount"></small></div>
    <button class="side-group-header collapsed" id="eastSeaToggle" aria-expanded="false">
      <span>동해 바다</span><span class="region-count-chip" id="regionCountChip"></span>
    </button>
    <div class="region-group collapsed" id="regionList">
      <div class="side-item" data-region="gosung">고성</div>
      <div class="side-item" data-region="sokcho">속초</div>
      <div class="side-item" data-region="yangyang">양양</div>
      <div class="side-item" data-region="gangneung">강릉</div>
      <div class="side-item" data-region="donghae">동해</div>
      <div class="side-item" data-region="samcheok">삼척</div>
      <div class="side-item" data-region="uljin">울진</div>
    </div>
    <div class="side-photo"><img src="assets/diving.jpg" alt=""></div>
  </aside>

  <main id="main">
    <div class="loading">불러오는 중…</div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
