name: Ocean Data Collect & Score

# schedule의 cron은 UTC 기준이다. '0 */4 * * *'(UTC 4시간마다)는
# KST(UTC+9)로는 매 4시간 +9시간 오프셋되어 01, 05, 09, 13, 17, 21시에 실행된다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Collect Open-Meteo data
        run: npm run collect:openmeteo

      - name: Collect KHOA data
        run: npm run collect:khoa
        env:
          # KHOA_SERVICE_KEY는 절대 코드에 하드코딩하지 않는다.
          # scripts/collect-khoa.js에서는 process.env.KHOA_SERVICE_KEY로만 참조한다.
          KHOA_SERVICE_KEY: ${{ secrets.KHOA_SERVICE_KEY }}

      - name: Build score
        run: npm run build:score

      - name: Commit and push scored data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scored.json
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋을 건너뜁니다."
          else
            git commit -m "chore: update scored data [skip ci]"
            git push
          fi
